<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Login e Cadastro</title>
    <link rel="stylesheet" href="CSS/login.css">
    <script src="JS/cadastro.js" defer></script>
    <link rel="icon" type="Image/png" href="Imagens/image.png">

</head>
<body>
    <div class="container1">
        <h2>Cadastro</h2>
        <div id="painelcad">
            <label for="nome">Digite seu nome:</label> <br>
            <input type="text" id="nome" name="nome"> <br>
            <label for="email">Digite seu email:</label><br>
            <input type="email" id="email" name="email"> <br>
            <label for="cpf">Digite seu CPF:</label> <br>
            <input type="text" id="cpf" name="cpf"> <br>
            <label for="nascimento">Informe sua data de nascimento:</label> <br>
            <input type="date" id="nascimento" name="nascimento">
            <br> <br> <button type="submit" onclick="Cadastrar()">Cadastrar</button>
        </div>
    </div>
    
</body>
</html>
